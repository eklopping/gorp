services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: /data/sessionnote.db
      UPLOAD_DIR: /data/uploads
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    volumes:
      - sessionnote-data:/data
    restart: unless-stopped

volumes:
  sessionnote-data:
